<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
<title>AI & Startup News – NewsData.io</title>


</head>

<body>

<h1>AI, Startup & IT News</h1>

<select id="country">
  <option value="pl,cz,sk,hu,ro,bg,lt,lv,ee">Eastern Europe</option>
  <option value="kz">Kazakhstan</option>
  <option value="kg">Kyrgyzstan</option>
  <option value="tj">Tajikistan</option>
  <option value="jp">Japan</option>
  <option value="us">USA</option>
  <option value="ru">Russia</option>
</select>

<div id="news">Loading news...</div>

<script>
const API_KEY = "pub_9a3fba3935fd420c82d90ff6dbc06f44";
const newsDiv = document.getElementById("news");
const countrySelect = document.getElementById("country");

const CATEGORY_RULES = {
  "AI": /AI|artificial intelligence|machine learning|LLM|neural/i,
  "Startup": /startup|founder|venture|VC|funding|accelerator|incubator/i,
  "Grants": /grant|subsidy|government support|state funding|policy/i
};

countrySelect.addEventListener("change", loadNews);

async function loadNews() {
  try {
    newsDiv.innerHTML = "Loading news...";

    const countries = countrySelect.value;
    const query = "AI OR startup OR technology OR grants OR policy";

    const url = `https://newsdata.io/api/1/news?apikey=${API_KEY}&q=${encodeURIComponent(query)}&country=${countries}&language=en`;

    const res = await fetch(url);
    const data = await res.json();

    let articles = data.results || [];

    articles = articles
      .map(a => ({
        title: a.title,
        description: a.description,
        link: a.link,
        image: a.image_url,
        pubDate: a.pubDate,
        source: a.source_id,
        content: (a.title || "") + " " + (a.description || "")
      }))
      .map(assignCategory)
      .filter(Boolean);

    const seen = new Set();
    articles = articles.filter(a => {
      if (seen.has(a.title)) return false;
      seen.add(a.title);
      return true;
    });

    articles.sort((a, b) => new Date(b.pubDate) - new Date(a.pubDate));

    newsDiv.innerHTML = "";

    articles.forEach(a => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        ${a.image ? `<img src="${a.image}">` : ""}
        <h3>${a.title}</h3>
        <p>${a.description || ""}</p>
        <a href="${a.link}" target="_blank">Read more</a>
        <div class="meta">${new Date(a.pubDate).toLocaleString()} | ${a.source}</div>
        <div class="category">${a.category}</div>
      `;
      newsDiv.appendChild(card);
    });

    if (!articles.length) {
      newsDiv.innerHTML = "No relevant news found.";
    }

  } catch (err) {
    console.error(err);
    newsDiv.innerHTML = "Failed to load news.";
  }
}

function assignCategory(article) {
  for (const key in CATEGORY_RULES) {
    if (CATEGORY_RULES[key].test(article.content)) {
      article.category = key;
      return article;
    }
  }
  return null;
}

loadNews();
</script>

</body>
</html>
