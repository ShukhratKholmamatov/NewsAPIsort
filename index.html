<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="/css/style.css">
<title>AI & Startup News – NewsData.io</title>


</head>

<body>

<h1>AI, Startup & IT News</h1>

<select id="country">
  <option value="kz">Kazakhstan</option>
  <option value="in">India</option>
  <option value="tj">Tajikistan</option>
  <option value="jp">Japan</option>
  <option value="us" selected>USA</option>
  <option value="ru">Russia</option>
</select>


<div id="news">Loading news...</div>

<script>
const API_KEY = "498173e0382c718bee1d05181386660c";
const newsDiv = document.getElementById("news");
const countrySelect = document.getElementById("country");

const CATEGORY_RULES = {
  AI: /AI|artificial intelligence|machine learning|LLM|neural/i,
  Startup: /startup|founder|venture|VC|funding|accelerator|incubator/i,
  Grants: /grant|subsidy|government|policy|regulation|state support/i
};

countrySelect.addEventListener("change", loadNews);

async function loadNews() {
  try {
    newsDiv.innerHTML = "Loading news...";

    const country = countrySelect.value;
    const query = "AI OR artificial intelligence OR startup OR technology OR grants OR policy";

    const url = `https://gnews.io/api/v4/search?q=${encodeURIComponent(query)}&lang=en&country=${country}&max=20&token=${API_KEY}`;

    const res = await fetch(url);
    const data = await res.json();

    let articles = data.articles || [];

    articles = articles
      .map(a => ({
        title: a.title,
        description: a.description,
        link: a.url,
        image: a.image,
        publishedAt: a.publishedAt,
        source: a.source.name,
        content: `${a.title} ${a.description}`
      }))
      .map(assignCategory)
      .filter(Boolean);

    // Remove duplicates
    const seen = new Set();
    articles = articles.filter(a => {
      if (seen.has(a.title)) return false;
      seen.add(a.title);
      return true;
    });

    // Sort newest first
    articles.sort((a, b) => new Date(b.publishedAt) - new Date(a.publishedAt));

    newsDiv.innerHTML = "";

    articles.forEach(a => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        ${a.image ? `<img src="${a.image}" alt="">` : ""}
        <h3>${a.title}</h3>
        <p>${a.description || ""}</p>
        <a href="${a.link}" target="_blank">Read more →</a>
        <div class="meta">${new Date(a.publishedAt).toLocaleString()} | ${a.source}</div>
        <div class="category">${a.category}</div>
      `;
      newsDiv.appendChild(card);
    });

    if (!articles.length) {
      newsDiv.innerHTML = "No relevant news found.";
    }

  } catch (err) {
    console.error(err);
    newsDiv.innerHTML = "Failed to load news.";
  }
}

function assignCategory(article) {
  for (const key in CATEGORY_RULES) {
    if (CATEGORY_RULES[key].test(article.content)) {
      article.category = key;
      return article;
    }
  }
  return null; // remove unrelated news
}

loadNews();
</script>


</body>
</html>
